name: Transcription voix off
on:
  push:
    branches: [medias-campagne]
    paths: ['fetch/audio/**', 'fetch/transcribe.py']
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: medias-campagne }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Installer
        run: pip install faster-whisper 2>&1 | tail -3
      - name: Transcrire
        run: python3 fetch/transcribe.py 2>&1 | tail -20
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "vremax-bot"; git config user.email "bot@vremaxx.com"
          git add fetch/out/transcripts || true
          git commit -m "Transcription voix off" || echo rien
          git pull --rebase origin medias-campagne && git push
